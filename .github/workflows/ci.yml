name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Single owner of the lint definition (file set + config + version). Do not
      # re-spell the shellcheck command here; keep CI and the pre-push gate on it.
      - run: bin/fm-lint.sh

  tests:
    # The serial suite outgrew the old single job's 15-minute cap (863s of test
    # time measured on main, 2026-08-02), so it runs as fixed parallel shards.
    # bin/fm-test.sh is the single owner of the file set and the partition:
    # every shard re-derives the whole partition and refuses to run unless the
    # shards disjointly cover every tests/*.test.sh, so a green run proves all
    # files ran. tests/fm-test.test.sh asserts shard/whole-set parity and that
    # this matrix matches the runner's denominator. Reproduce one shard locally
    # with the same `bin/fm-test.sh --shard K/4`.
    name: Behavior tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # Let every shard report its own verdict; the tests-complete gate below
      # is what fails the check when any one shard fails or is cancelled.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Measured basis (2026-08-03): the serial loop took 863s on main in CI and
    # per-file local timing puts the heaviest round-robin shard at ~40% of the
    # suite, so the worst shard is ~6 minutes of tests plus under a minute of
    # setup. 10 minutes leaves 3+ minutes of headroom on that worst shard while
    # a hung test now trips 5 minutes sooner than the old whole-suite cap.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install tasks-axi for backlog-handoff delegation
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version
      # Single owner of the test definition (file set + partition + execution
      # rules). Do not re-spell the test loop here; keep CI and the pre-push
      # gate (.no-mistakes.yaml commands.test) on bin/fm-test.sh.
      - run: bin/fm-test.sh --shard ${{ matrix.shard }}/4

  tests-complete:
    # The single fan-in verdict for the sharded behaviour suite: this is the
    # check branch protection should require (task fm-branch-protection-c8).
    # `if: always()` makes it report a verdict even when shards fail or are
    # cancelled, and the explicit result test below turns anything but
    # every-shard-success - including skipped, cancelled, or never-scheduled
    # shards - into a failure, never a silent pass.
    name: Behavior tests complete
    runs-on: ubuntu-latest
    needs: tests
    if: always()
    steps:
      - name: Require every shard green
        run: |
          set -eu
          result="${{ needs.tests.result }}"
          echo "aggregate shard result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::behaviour-test shards did not all succeed (aggregate result: $result)"
            exit 1
          fi

  macos-stock-bash:
    name: Stock macOS Bash snapshot compatibility
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Run snapshot consumers with stock Bash
        shell: /bin/bash {0}
        env:
          PATH: /bin:/usr/bin:/usr/sbin:/sbin:/usr/local/bin:/opt/homebrew/bin
        run: |
          set -eu
          case "$BASH_VERSION" in
            3.2.57*) ;;
            *) echo "::error::expected stock macOS Bash 3.2.57, got $BASH_VERSION"; exit 1 ;;
          esac
          /bin/bash --version | head -1
          command -v jq >/dev/null || { echo "::error::jq is required"; exit 1; }
          /bin/bash -n bin/fm-fleet-snapshot.sh

          snapshot_output=$(/bin/bash tests/fm-fleet-snapshot-view.test.sh)
          printf '%s\n' "$snapshot_output"
          snapshot_count=$(printf '%s\n' "$snapshot_output" | grep -c '^ok - ')
          [ "$snapshot_count" -eq 13 ] || {
            echo "::error::expected 13 snapshot/fleet-view tests, got $snapshot_count"
            exit 1
          }

          bearings_output=$(/bin/bash tests/fm-bearings-snapshot.test.sh)
          printf '%s\n' "$bearings_output"
          bearings_count=$(printf '%s\n' "$bearings_output" | grep -c '^ok - ')
          [ "$bearings_count" -eq 36 ] || {
            echo "::error::expected 36 Bearings tests, got $bearings_count"
            exit 1
          }

  invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Symlinks must stay intact
        run: |
          set -eu
          [ "$(readlink CLAUDE.md)" = "AGENTS.md" ] || { echo "::error::CLAUDE.md must be a symlink to AGENTS.md"; exit 1; }
          [ "$(readlink .claude/skills)" = "../.agents/skills" ] || { echo "::error::.claude/skills must be a symlink to ../.agents/skills"; exit 1; }
      - name: Personal fleet paths must not be tracked
        run: |
          set -eu
          tracked=$(git ls-files -- data state config projects .no-mistakes)
          if [ -n "$tracked" ]; then
            echo "::error::Personal fleet paths are tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi
