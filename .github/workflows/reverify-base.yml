# The cheap re-verification of a PR against a base that has MOVED under it.
#
# THE PROBLEM. GitHub re-runs a PR's checks only when the PR's own head changes,
# never when the base moves. On 2026-08-09 PRs 31-36 all still showed green
# measured against a base that four later merges had replaced. The platform's
# only remedy is to push the branch again, which re-drives all four behaviour
# shards, lint, repo invariants and the macOS stock-Bash check - for every open
# PR, every time main moves.
#
# THE CHEAP PATH. RE-RUN THIS WORKFLOW (`gh run rerun <run-id>`, or "Re-run all
# jobs" on it). It re-fetches the base at run time, so it always measures
# against the base as it is NOW, and it runs only the base test files that
# DIFFER from the branch's copies. No new push, no new head, and nothing else
# re-run. Measured on this repo (2026-08-09): 2 of 85 base test files needed
# running.
#
# WHY IT IS ITS OWN WORKFLOW rather than a job inside ci.yml. Re-running one job
# of a large run means finding that job's id first; re-running a standalone
# workflow is one command against the run itself, which is the whole ergonomic
# point. The cost is that it cannot take `needs:` on CI's jobs, so it reads this
# head's own check results instead - see bin/fm-reverify-premise.sh, which is
# also the stronger reading, because it is re-read on every re-run.
#
# IT IS A REQUIRED CHECK, not advisory (captain's decision, 2026-08-09): the
# equivalent gate inside bin/fm-pr-merge.sh is bypassed entirely by merging from
# the GitHub UI, which is how main has gone red before. So every path below
# either publishes a verdict or FAILS; none of them can go green having checked
# nothing.
#
# THE CAPTAIN'S APPROVALS reach this check the only way they can: as a signed
# line in the PR body, verified in a job of its own. A branch may deliberately
# supersede behaviour the base asserts, and bin/fm-pr-merge.sh honours that from
# a private record - which a GitHub runner cannot read, so this check would
# otherwise report the same findings and stay red with nothing the branch could
# push to fix it. bin/fm-supersession-verify.sh decides what the captain signed;
# bin/fm-reverify-base.sh decides what that excuses. A finding no approval
# covers still blocks.
#
# WHY THAT VERIFICATION IS ITS OWN JOB, checked out at the BASE. This job runs
# the branch's own scripts by construction - that is what re-verification means
# - so a secret in ITS environment would be a secret every PR could read. The
# verifying job runs the BASE's copy of the verifier and nothing of the PR's,
# exactly as .github/workflows/ci.yml's waiver job does, and hands this job only
# its non-secret verdict. Neither closes the broader path where a PR edits this
# workflow file; that is inherent to pull_request events and is mitigated by
# branch protection.
#
# NEITHER SCRIPT'S WORK IS RE-SPELLED HERE. bin/fm-assert-tests-kept.sh is the
# single owner of which of the base's test files still need running,
# bin/fm-reverify-base.sh renders its verdict, bin/fm-reverify-premise.sh
# establishes the premise the skip rests on, and bin/fm-supersession-verify.sh
# establishes what the captain approved. This file wires them together and
# decides nothing.
name: Base re-verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  # The premise is this head's own behaviour-suite result, read from its check
  # runs. Nothing here writes.
  checks: read
  # The captain's attestation is read from the PR body at job time, never from
  # the event payload: an approval always arrives as an edit to an open PR, and
  # editing a body triggers no workflow, so the body a re-run replays predates
  # it (bin/fm-supersession-verify.sh owns that reasoning).
  pull-requests: read

jobs:
  supersession:
    # Cheap (a checkout, one API read and at most one HMAC) and always exits 0,
    # whatever the verdict, so the required job below is never skipped by a
    # failed dependency. A PR with no attestation - almost every PR - passes
    # through it silently.
    name: Supersession attestation
    runs-on: ubuntu-latest
    outputs:
      superseded: ${{ steps.verify.outputs.superseded }}
      entries: ${{ steps.verify.outputs.entries }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The BASE's verifier and libraries, never the PR's. A pull_request
          # build otherwise runs PR-authored code, which would let a PR replace
          # the script that decides whether its own findings may be excused -
          # and it holds the secret.
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Verify the captain's supersession attestation
        id: verify
        env:
          FM_SUPERSESSION_SECRET: ${{ secrets.FM_SUPERSESSION_SECRET }}
          FM_SUPERSESSION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FM_SUPERSESSION_REPO: ${{ github.repository }}
          FM_SUPERSESSION_PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # A base that predates this check carries no verifier at all, so this
          # reports nothing-approved rather than exiting 127 and failing the
          # job. That is the fail-closed verdict, not a workaround: a base with
          # no verifier can honour no approval, so "everything blocks" is
          # correct. It self-heals, because every base from this change onwards
          # has the verifier.
          if [ ! -x bin/fm-supersession-verify.sh ]; then
            echo "::warning::the base branch carries no supersession verifier, so no captain approval can be honoured here; every base-assertion finding blocks"
            echo "superseded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bin/fm-supersession-verify.sh

  reverify-base:
    name: Base assertions re-verified
    runs-on: ubuntu-latest
    needs: supersession
    # A required check that is skipped never reports, and branch protection then
    # waits on it forever. `always()` is what keeps the dependency above from
    # being able to cause that: this job runs and reports even if that job
    # failed outright, in which case it simply receives no approvals and every
    # finding blocks, exactly as before this check existed.
    if: always()
    # Two waits in series: up to ~25 minutes for this head's behaviour suite to
    # conclude (the premise), then the re-verification itself. Its worst case is
    # a PR that rewrites many of the base's test files, since each is run twice -
    # the same worst case bin/fm-pr-merge.sh already pays at merge time, moved
    # earlier rather than added. A timeout here fails the job, which is the
    # correct reading: no verdict was established.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          # The PR's own head, never refs/pull/N/merge. The question is whether
          # the branch AS IT IS still satisfies the base's current assertions,
          # and a merge ref has already merged the base in, which would answer a
          # different question and answer it green every time.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Establish the premise the cheap path rests on
        id: premise
        env:
          GH_TOKEN: ${{ github.token }}
          # Both names are published by .github/workflows/ci.yml, which owns
          # them. tests/fm-reverify-base.test.sh derives both from that file at
          # run time and asserts these match, so they cannot drift into a second,
          # quietly wrong copy.
          FANIN_CHECK: Behavior tests complete
          SHARD_CHECK_PREFIX: 'Behavior tests (shard '
          # Through env rather than interpolated into the command, matching
          # ci.yml's rule for every value that comes off the event payload.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          bin/fm-reverify-premise.sh \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$HEAD_SHA" \
            --fanin-check "$FANIN_CHECK" \
            --shard-check-prefix "$SHARD_CHECK_PREFIX"

      - name: Report the CI waiver instead of a verdict
        if: steps.premise.outputs.premise == 'waived'
        run: |
          set -eu
          echo "reverify: waived"
          echo "::warning::the base's assertions were NOT re-verified against this branch: this PR carries a verified firstmate CI waiver, so it has no green suite to rest the cheap path on and no test evidence to re-verify"

      # The base's OWN test files are what run below, so this job needs what the
      # behaviour-suite job installs for them; a base test file whose baseline
      # cannot run here is reported unexecuted, which blocks.
      - name: Install pinned ShellCheck
        if: steps.premise.outputs.premise == 'green'
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install tasks-axi for backlog-handoff delegation
        if: steps.premise.outputs.premise == 'green'
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version

      - name: Fetch the base branch as it is NOW
        if: steps.premise.outputs.premise == 'green'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -eu
          # This fetch is the whole trick: it runs at JOB time, so re-running
          # this workflow after main moves measures against the new main without
          # the PR's head changing at all.
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git log -1 --format='base %H %s' "origin/$BASE_REF"

      - name: Re-verify the base's assertions against this branch
        if: steps.premise.outputs.premise == 'green'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Empty unless the job above verified the captain's signature over
          # this exact head. Through env rather than interpolated into the
          # command, matching ci.yml's rule for every value that comes off the
          # event payload.
          FM_SUPERSESSION_ENTRIES: ${{ needs.supersession.outputs.entries }}
        run: |
          set -eu
          bin/fm-reverify-base.sh \
            --worktree . \
            --base "origin/$BASE_REF" \
            --branch "$HEAD_SHA" \
            --assume-branch-suite-green
